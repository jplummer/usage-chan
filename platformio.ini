; usage-chan — Claude usage monitor on a Stack-Chan (M5Stack CoreS3)
;
; Only one env. Unlike claude-usage-stick, which supports eight boards behind
; -DBOARD_* flags, this targets one piece of hardware and says so.

[env:stackchan]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200

; 115200 exactly, and it has to be stated — leaving it out is not enough.
;
; CoreS3 talks over the ESP32-S3's NATIVE USB: the port is /dev/cu.usbmodem*,
; not usbserial, because there is no UART bridge chip in the path. On native USB
; CDC the baud rate is fiction — there is no UART to clock, so the number is
; something both ends agree to ignore while data moves at USB speed anyway.
; Asking esptool to renegotiate it asks the device to do a meaningless thing,
; and it does not answer afterwards:
;
;     Stub running...
;     Changing baud rate to 921600
;     A fatal error occurred: No serial data received.
;
; Deleting this line does NOT fix it: PlatformIO then falls back to the board
; definition, and boards/m5stack-cores3.json sets "speed": 921600. The value has
; to be stated to override it.
;
; 115200 is the specific value that works because it is esptool's own ESP_ROM_BAUD.
; The renegotiation is guarded by `if args.baud > initial_baud:` (esptool
; __init__.py:717), so an equal value skips change_baud() entirely rather than
; performing a no-op one.
;
; This costs no upload time. The 1.19MB image still moves at USB speed.
upload_speed = 115200

; 16MB flash. default_16MB keeps the dual-app OTA layout (~6.5MB each) with
; room to spare; the app is well under 2MB today. NVS stays at 0x9000, which is
; where the encrypted token and WiFi credentials live — a reflash preserves them.
board_build.partitions = default_16MB.csv

; CoreS3 module is N16R8: QIO flash, OPI PSRAM. PSRAM holds the framebuffer
; sprite (320x240x16bpp = 150KB), and later the audio buffers if the voice idea
; in plan.md phase 3 happens.
board_build.arduino.memory_type = qio_opi

lib_deps =
    ; M5GFX is pinned separately from M5Unified on purpose. M5Unified 0.2.21
    ; only requires M5GFX >=0.2.10, and anything below 0.2.27 renders a black
    ; screen on this board — see docs/display-notes.md. Left to its own
    ; resolution PlatformIO can and will pick a too-old M5GFX.
    m5stack/M5GFX@^0.2.28
    m5stack/M5Unified@^0.2.21
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1   ; CoreS3 is native USB — Serial goes over it
    -DCORE_DEBUG_LEVEL=3          ; keeps M5GFX's "[Autodetect] board_..." line visible
